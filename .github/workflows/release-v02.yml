name: 发布 v0.2.0
on:
  push:
    tags: ['v0.2.0']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 等待此提交的 Windows 构建并发布已测试产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            run=$(gh run list --workflow windows.yml --commit "$GITHUB_SHA" --limit 5 --json databaseId,status,conclusion --jq '[.[] | select(.conclusion=="success")][0].databaseId // empty')
            if [ -n "$run" ]; then break; fi
            sleep 8
          done
          test -n "$run"
          gh run download "$run" -n AIM-ZERO-Windows -D dist
          cd dist
          sha256sum -c AIM-ZERO-Windows.zip.sha256
          unzip -j AIM-ZERO-Windows.zip AIM-ZERO.exe
          gh release upload "$GITHUB_REF_NAME" --clobber AIM-ZERO-Windows.zip AIM-ZERO.exe AIM-ZERO-Windows.zip.sha256
          gh release edit "$GITHUB_REF_NAME" --title 'AIM ZERO v0.2.0' --notes '新增 Viscose S2 精选五项离线训练。运动和得分为本地模拟，具体研究来源及待校准参数见源码中的 CALIBRATION.md。'
